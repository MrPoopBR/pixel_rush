name: "PIXEL RUSH R159 - APK DEBUG ARM64 (menu/tutorial/audio/perf)"

on:
  push:
    branches:
      - build/r159-debug-327910
    paths:
      - ".github/r159_parts/part06.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixelrush-r159-apk-debug
  cancel-in-progress: false

jobs:
  apk-debug:
    if: github.repository == 'MrPoopBR/pixel_rush' && github.ref == 'refs/heads/build/r159-debug-327910'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
      MAKEFLAGS: "-j4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout isolated source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reassemble and SHA256-verify exact R154 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, re, zipfile
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          names = [f'r154-source.part{i:02d}' for i in range(1,5)]
          parts = [root/'r154-source'/name for name in names]
          if not all(p.is_file() for p in parts):
              raise SystemExit('FALTAM PARTES DA R154: envie os 4 arquivos .part na pasta r154-source.')
          sizes = [10_000_000,10_000_000,10_000_000,8_155_030]
          if [p.stat().st_size for p in parts] != sizes:
              raise SystemExit('Tamanho de parte divergente: fonte R154 incompleta ou incorreta.')
          archive = root/'R154_FONTE_VALIDADA.zip'
          h = hashlib.sha256()
          with archive.open('wb') as dst:
              for p in parts:
                  with p.open('rb') as f:
                      for block in iter(lambda:f.read(1024*1024), b''):
                          h.update(block); dst.write(block)
          expected = '2a27e23a55142b8ce1f707794be302f8470015f10591449c9a031f84396e47e9'
          if h.hexdigest() != expected:
              raise SystemExit(f'SHA-256 DA FONTE R154 INCORRETO: {h.hexdigest()}')
          target = pathlib.Path(os.environ['RUNNER_TEMP'])/'r154_game'
          target.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None: raise SystemExit('CRC invalido na fonte.')
              z.extractall(target)
          project = target/'PIXELRUSH_V327906_LIMPA'
          specpath=project/'buildozer.spec'
          if not specpath.is_file(): raise SystemExit('buildozer.spec ausente.')
          spec=specpath.read_text(encoding='utf-8')
          expected_keys={'package.name':'bigheadmobile_pixelrush','package.domain':'com',
              'version':'3.279.06','android.numeric_version':'327906',
              'android.archs':'arm64-v8a','android.api':'36','android.minapi':'26'}
          for key,val in expected_keys.items():
              m=re.search(r'^\s*'+re.escape(key)+r'\s*=\s*(\S+)\s*$',spec,re.M)
              if not m or m.group(1)!=val: raise SystemExit(f'CONFIG INCOMPATIVEL: {key}')
          if 'python3==3.12.12,hostpython3==3.12.12,pygame-ce' not in spec:
              raise SystemExit('Python 3.12 / pygame-ce da R154 nao encontrado.')
          pcm=list((project/'assets/audio/prebaked_r154').glob('*.pcm'))
          if len(pcm)!=6: raise SystemExit(f'Esperados 6 PCM, encontrados {len(pcm)}.')
          for path in ['main.py','p4a-recipes/pygame-ce/__init__.py','p4a-recipes/python3/__init__.py']:
              if not (project/path).is_file(): raise SystemExit(f'Ausente: {path}')
          with (root/'r154-project-dir.txt').open('w') as f: f.write(str(project))
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a') as f:
              f.write('R154_PROJECT_DIR='+str(project)+'\n')
          print('Fonte R154 exata validada:',expected)
          print('Package ID: com.bigheadmobile_pixelrush; versionCode: 327906; PCM:',len(pcm))
          PY

      - name: Aplicar R155 sobre a fonte R154 SHA256-validada
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/r155_apply_bytecode_fix.py" "$R154_PROJECT_DIR"
          python3 -m py_compile "$R154_PROJECT_DIR/src/pixelrush/platform/legacy_imports_v327797.py"
          python3 - <<'PY'
          import hashlib,os,pathlib
          p=pathlib.Path(os.environ['R154_PROJECT_DIR'])
          s=(p/'buildozer.spec').read_text()
          assert 'version = 3.279.07' in s
          assert 'android.numeric_version = 327907' in s
          assert 'package.name = bigheadmobile_pixelrush' in s
          assert 'package.domain = com' in s
          assert 'python3==3.12.12,hostpython3==3.12.12,pygame-ce' in s
          print('PRE-FLIGHT R155 OK: PyC fallback + versionCode 327907')
          PY

      - name: Aplicar R156 autenticada e executar testes antes do build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, bz2, hashlib, os, pathlib, subprocess
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          game = pathlib.Path(os.environ['R154_PROJECT_DIR'])
          path = workspace/'PIXELRUSH_R156_PATCH_GITHUB.b64.txt'
          if not path.is_file():
              raise SystemExit('Patch R156 nao foi enviado ao ramo isolado')
          lines=path.read_text(encoding='ascii').splitlines()
          if lines == ['R156_PARTS_V1']:
              parts=[workspace/'.github/r156_parts'/f'part{i}.txt' for i in range(4)]
              if not all(p.is_file() for p in parts):
                  raise SystemExit('Fragmentos autenticados R156 incompletos')
              data=''.join(p.read_text(encoding='ascii').strip() for p in parts)
              if len(data)!=23592:
                  raise SystemExit('Tamanho do patch R156 divergente')
              lines=['PIXELRUSH_R156_PATCH_BZ2_BASE64',
                     'SHA256_BZ2=3bd300e2eef754723a65a2cbf0b2489c49389bed1cd56748e606fff35d0e5bd0',
                     'SHA256_PATCH=1f7e2792e76dffa2e6c81e4970a7c4f266abcf9886f8e505e9a7a212439105b3',
                     data]
          if lines[0]!='PIXELRUSH_R156_PATCH_BZ2_BASE64':
              raise SystemExit('Cabecalho de patch R156 incorreto')
          declared=dict(line.split('=',1) for line in lines[1:3])
          packed=base64.b64decode(''.join(lines[3:]),validate=True)
          if hashlib.sha256(packed).hexdigest()!='3bd300e2eef754723a65a2cbf0b2489c49389bed1cd56748e606fff35d0e5bd0':
              raise SystemExit('SHA256 do patch compactado diferente da fonte R156')
          if hashlib.sha256(packed).hexdigest()!=declared['SHA256_BZ2']:
              raise SystemExit('Declaracao SHA BZ2 incorreta')
          patch=bz2.decompress(packed)
          if hashlib.sha256(patch).hexdigest()!='1f7e2792e76dffa2e6c81e4970a7c4f266abcf9886f8e505e9a7a212439105b3':
              raise SystemExit('Patch descompactado nao corresponde a R156')
          if hashlib.sha256(patch).hexdigest()!=declared['SHA256_PATCH']:
              raise SystemExit('Declaracao SHA patch incorreta')
          patchfile=workspace/'r156.patch'
          patchfile.write_bytes(patch)
          subprocess.run(['git','apply','-p5','--check',str(patchfile)],cwd=game,check=True)
          subprocess.run(['git','apply','-p5',str(patchfile)],cwd=game,check=True)
          spec=(game/'buildozer.spec').read_text(encoding='utf-8')
          if ('version = 3.279.08' not in spec or
              'android.numeric_version = 327908' not in spec or
              'package.name = bigheadmobile_pixelrush' not in spec or
              'package.domain = com' not in spec):
              raise SystemExit('Configuracao R156 nao validou')
          source=(game/'PixelRush_v3.277.11_PRODUCAO_ANDROID_RC.py').read_text(encoding='utf-8')
          if 'v3.279.08-ANDROID-RC' not in source:
              raise SystemExit('Versao do motor R156 ausente')
          for mod in ['src/pixelrush/world/sky_premium_r156.py',
                      'src/pixelrush/world/parallax_extra_r156.py',
                      'src/pixelrush/platform/legacy_imports_v327797.py']:
              if not (game/mod).is_file():
                  raise SystemExit('Modulo critico ausente: '+mod)
          subprocess.run(['python3','tests/test_r156_apresentacao_estatica.py'],cwd=game,check=True)
          subprocess.run(['python3','-m','compileall','-q','main.py','src/pixelrush/world',
                          'src/pixelrush/ui/tutorial','src/pixelrush/rendering'],cwd=game,check=True)
          print('PRE-FLIGHT R156 OK; pacote/versao/testes/patch autenticados')
          PY

      - name: Apply R159 incremental patch (SHA256) and verify source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, bz2, hashlib, os, pathlib, subprocess
          workspace=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          game=pathlib.Path(os.environ['R154_PROJECT_DIR'])
          parts=[workspace/'.github/r159_parts'/f'part{i:02d}.txt' for i in range(7)]
          if not all(p.is_file() for p in parts):
              raise SystemExit('R159: fragmentos ausentes')
          encoded=''.join(p.read_text(encoding='ascii').strip() for p in parts)
          if len(encoded)!=31544:
              raise SystemExit('R159: tamanho base64 incorreto')
          packed=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(packed).hexdigest()!='9f2751cc573b742a4a8c6bcc58c3d41d248b966b5a8210c02e85d91a5807503a':
              raise SystemExit('R159: SHA256 BZ2 incorreto')
          patch=bz2.decompress(packed)
          if hashlib.sha256(patch).hexdigest()!='1165c1ced4ad2601caccf1e3458b2d7025e62171c90b97c719c219cbf10a97c1':
              raise SystemExit('R159: SHA256 patch incorreto')
          path=workspace/'r159_incremental.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],cwd=game,check=True)
          subprocess.run(['git','apply',str(path)],cwd=game,check=True)
          cfg=(game/'buildozer.spec').read_text(encoding='utf8')
          for val in ('version = 3.279.10','android.numeric_version = 327910',
                      'package.name = bigheadmobile_pixelrush','package.domain = com',
                      'android.archs = arm64-v8a'):
              if val not in cfg:
                  raise SystemExit('R159: buildozer.spec sem '+val)
          engine=(game/'PixelRush_v3.277.11_PRODUCAO_ANDROID_RC.py').read_text(encoding='utf8')
          if 'v3.279.10-ANDROID-RC' not in engine:
              raise SystemExit('R159: versao do motor incorreta')
          for name in ('tests/test_r159_correcao_integradora.py',
                       'src/pixelrush/ui/tutorial/gesture_art_r159.py',
                       'src/pixelrush/world/parallax_extra_r156.py'):
              if not (game/name).is_file():
                  raise SystemExit('R159: arquivo ausente '+name)
          subprocess.run(['python3','-m','compileall','-q','main.py','src'],cwd=game,check=True)
          print('R159 autenticada, integracao e sintaxe confirmadas')
          PY

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Free disk and install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git zip unzip curl wget ca-certificates openjdk-17-jdk \
            build-essential autoconf automake autopoint gettext libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev cmake ninja-build \
            libffi-dev libssl-dev libltdl-dev liblzma-dev libsqlite3-dev \
            ccache binutils python3-pip python3-venv
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          df -h /

      - name: Install isolated Buildozer and patchelf
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/r154-build-venv"
          python3 -m venv --system-site-packages "$VENV"
          "$VENV/bin/python" -c "import site; assert site.ENABLE_USER_SITE, 'pip --user bloqueado neste venv'"
          "$VENV/bin/python" -m pip install -U pip wheel 'setuptools<81' 'Cython==0.29.36' legacy-cgi buildozer 'patchelf>=0.18.0.0'
          echo "$VENV/bin" >> "$GITHUB_PATH"
          if ! "$VENV/bin/patchelf" --help 2>&1 | grep -q -- '--page-size'; then
            echo "ERRO: patchelf sem suporte a --page-size exigido pela receita Python ARM64 da R154."
            exit 2
          fi
          "$VENV/bin/buildozer" --version
          "$VENV/bin/patchelf" --version

      - name: Run R159 pygame-ce tests (headless)
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          python -m pip install 'pygame-ce==2.5.8'
          cd "$R154_PROJECT_DIR"
          python tests/test_r159_correcao_integradora.py

      - name: Build APK DEBUG ARM64 (no AAB, no Play signing)
        shell: bash
        run: |
          set -euo pipefail
          cd "$R154_PROJECT_DIR"
          echo "Build R159 corrigido em $R154_PROJECT_DIR"
          buildozer -v android debug 2>&1 | tee "$GITHUB_WORKSPACE/R159_BUILD_LOG.txt"
          shopt -s nullglob
          apks=(bin/*.apk)
          if (( ${#apks[@]} == 0 )); then echo 'Buildozer terminou sem APK' >&2; exit 3; fi
          cp "${apks[0]}" "$GITHUB_WORKSPACE/PIXELRUSH_V327910_R159_DEBUG_ARM64.apk"

      - name: Verify package, signature, ABI and 16 KiB ELF alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/PIXELRUSH_V327910_R159_DEBUG_ARM64.apk"
          SDKROOT="$HOME/.buildozer/android/platform/android-sdk"
          AAPT="$(find "$SDKROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$SDKROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$SDKROOT/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$AAPT" && test -x "$APKSIGNER" && test -x "$ZIPALIGN"
          "$AAPT" dump badging "$APK" | grep '^package:' | tee "$GITHUB_WORKSPACE/R159_PACKAGE.txt"
          grep -q "name='com.bigheadmobile_pixelrush'" "$GITHUB_WORKSPACE/R159_PACKAGE.txt"
          grep -q "versionCode='327910'" "$GITHUB_WORKSPACE/R159_PACKAGE.txt"
          "$APKSIGNER" verify --verbose "$APK" | tee "$GITHUB_WORKSPACE/R159_SIGNATURE.txt"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" | tee "$GITHUB_WORKSPACE/R159_ZIPALIGN.txt"
          sed -e "s/327907/327910/g" -e "s/R155_AUDITORIA_APK/R159_AUDITORIA_APK/g" "$GITHUB_WORKSPACE/.github/scripts/r155_static_apk_audit.py" > "$GITHUB_WORKSPACE/r159_static_apk_audit.py"
          python3 "$GITHUB_WORKSPACE/r159_static_apk_audit.py" "$APK"
          test -s "$GITHUB_WORKSPACE/R159_AUDITORIA_APK.json"
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/R159_APK_SHA256.txt"

      - name: Upload verified APK DEBUG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PIXELRUSH_R159_APK_DEBUG_ARM64
          path: PIXELRUSH_V327910_R159_DEBUG_ARM64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Preserve APK if post-build validation fails (NOT HOMOLOGATED)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PIXELRUSH_R159_APK_DEBUG_NAO_HOMOLOGADO
          path: PIXELRUSH_V327910_R159_DEBUG_ARM64.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build diagnostics even on error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PIXELRUSH_R159_BUILD_LOGS
          path: |
            R159_BUILD_LOG.txt
            R159_PACKAGE.txt
            R159_SIGNATURE.txt
            R159_ZIPALIGN.txt
            R159_APK_SHA256.txt
            R159_AUDITORIA_APK.json
          if-no-files-found: ignore
          retention-days: 14
