name: PIXEL RUSH QA v3.277.35 - Prototipo SDL OpenGL ES sem integracao

on:
  push:
    branches:
      - qa/android-gles-direct-v3.277.35
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixelrush-qa-gles-direct-v327735
  cancel-in-progress: false

jobs:
  gles-prototype:
    if: github.repository == 'MrPoopBR/pixel_rush' && github.ref == 'refs/heads/qa/android-gles-direct-v3.277.35'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout isolado (sem tocar main, DEV ou AAB)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.13 isolado
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Gates de integridade QA e sintaxe
        run: |
          set -euo pipefail
          python3 .github/scripts/qa_preflight_v327735.py
          python3 -m py_compile             pixelrush_qa_gles_present_v327735.py             tests/test_qa_gles_direct_v327735.py             pixelrush_qa_gles_gate_v327734.py             .github/scripts/qa_preflight_v327735.py             PixelRush_v3.277.11_PRODUCAO_ANDROID_RC.py
          # A janela do jogo real permanece SDL Surface + CPU; sem OpenGL no main.
          ! grep -q 'GLES2DirectPresenterQA' main.py
          ! grep -q 'GLES2DirectPresenterQA' PixelRush_v3.277.11_PRODUCAO_ANDROID_RC.py

      - name: Dependencias SDL Mesa Xvfb de teste
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libegl1 libgl1-mesa-dri libgles2 libgl1
          python3 -m pip install --disable-pip-version-check pygame-ce==2.5.8

      - name: Teste de janela real SDL GLES2, EGL/GLX e equivalencia por pixel
        env:
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONPATH: .
          PIXELRUSH_QA_GLES_REPORT: qa-gles-direct-v327735.json
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1024x1280x24" python3 -m unittest             tests.test_qa_gles_direct_v327735 -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('qa-gles-direct-v327735.json')
          assert p.is_file(), 'Falta relatorio de pixels, gate bloqueado'
          d=json.loads(p.read_text('utf8'))
          assert d['gpu_readbacks_durante_apresentacao']==0
          assert d['integracao_jogo_aprovada'] is False
          assert len(d['testes'])==12
          assert all(t['pixels_diferentes']==0 for t in d['testes'] if t['zoom']==0)
          print('GATE APROVADO para isolamento, NAO para ativacao GPU:',len(d['testes']),'cenas')
          PY

      - name: Salvar evidencias e preflight (mesmo se falhar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixelrush-qa-gles-direct-v327735-evidencias
          path: |
            qa-gles-direct-v327735.json
            preflight-qa-v327735.json
          if-no-files-found: warn
          retention-days: 14
