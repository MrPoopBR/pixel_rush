name: "PIXEL RUSH R154 - Revalidar APK existente (sem recompilar)"

on:
  push:
    branches:
      - build/r154-debug-327906
    paths:
      - ".github/workflows/r154-revalidar-apk-gerado.yml"
      - ".github/scripts/r154_static_apk_audit.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pixelrush-r154-revalidacao-apk
  cancel-in-progress: false

jobs:
  revalidar-apk-existente:
    if: github.repository == 'MrPoopBR/pixel_rush' && github.ref == 'refs/heads/build/r154-debug-327906'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout verificador independente
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Baixar APK ja construido no run 43116661899
        uses: actions/download-artifact@v4
        with:
          name: PIXELRUSH_R154_APK_DEBUG_NAO_HOMOLOGADO
          repository: MrPoopBR/pixel_rush
          run-id: 43116661899
          github-token: ${{ github.token }}
          path: apk-original

      - name: Verificar APK original SHA256, manifesto, assinatura e zipalign
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/apk-original/PIXELRUSH_V327906_R154_DEBUG_ARM64.apk"
          test -f "$APK"
          EXPECTED='0f12e59327b5284fca0df0e009d7d856b997f84c324a5bfcc7c656cda9306b44'
          echo "$EXPECTED  $APK" | sha256sum -c -
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDKROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          SIGNER="$(find "$SDKROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ALIGN="$(find "$SDKROOT/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$AAPT" && test -x "$SIGNER" && test -x "$ALIGN"
          "$AAPT" dump badging "$APK" | grep '^package:' | tee R154_PACKAGE.txt
          grep -q "name='com.bigheadmobile_pixelrush'" R154_PACKAGE.txt
          grep -q "versionCode='327906'" R154_PACKAGE.txt
          "$SIGNER" verify --verbose "$APK" | tee R154_SIGNATURE.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' R154_SIGNATURE.txt
          "$ALIGN" -c -P 16 -v 4 "$APK" > R154_ZIPALIGN.txt
          grep -q 'Verification successful' R154_ZIPALIGN.txt

      - name: Auditar 129 ELF ARM64 e tar.gz libpybundle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/r154_static_apk_audit.py
          python3 .github/scripts/r154_static_apk_audit.py apk-original/PIXELRUSH_V327906_R154_DEBUG_ARM64.apk
          sha256sum apk-original/PIXELRUSH_V327906_R154_DEBUG_ARM64.apk > R154_APK_SHA256.txt

      - name: Entregar APK original com auditoria estatica APROVADA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PIXELRUSH_R154_APK_DEBUG_VALIDADO_ESTATICAMENTE
          path: apk-original/PIXELRUSH_V327906_R154_DEBUG_ARM64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Entregar laudo da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PIXELRUSH_R154_AUDITORIA_ESTÁTICA
          path: |
            R154_AUDITORIA_APK.json
            R154_PACKAGE.txt
            R154_SIGNATURE.txt
            R154_ZIPALIGN.txt
            R154_APK_SHA256.txt
          if-no-files-found: ignore
          retention-days: 14
