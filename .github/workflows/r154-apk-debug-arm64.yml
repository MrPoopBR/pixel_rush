name: "PIXEL RUSH R154 - APK DEBUG ARM64"

on:
  push:
    branches:
      - build/r154-debug-327906
    paths:
      - "r154-source/r154-source.part*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixelrush-r154-apk-debug
  cancel-in-progress: false

jobs:
  apk-debug:
    if: github.repository == 'MrPoopBR/pixel_rush' && github.ref == 'refs/heads/build/r154-debug-327906'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
      MAKEFLAGS: "-j4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout isolated source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reassemble and SHA256-verify exact R154 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, re, zipfile
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          names = [f'r154-source.part{i:02d}' for i in range(1,5)]
          parts = [root/'r154-source'/name for name in names]
          if not all(p.is_file() for p in parts):
              raise SystemExit('FALTAM PARTES DA R154: envie os 4 arquivos .part na pasta r154-source.')
          sizes = [10_000_000,10_000_000,10_000_000,8_155_030]
          if [p.stat().st_size for p in parts] != sizes:
              raise SystemExit('Tamanho de parte divergente: fonte R154 incompleta ou incorreta.')
          archive = root/'R154_FONTE_VALIDADA.zip'
          h = hashlib.sha256()
          with archive.open('wb') as dst:
              for p in parts:
                  with p.open('rb') as f:
                      for block in iter(lambda:f.read(1024*1024), b''):
                          h.update(block); dst.write(block)
          expected = '2a27e23a55142b8ce1f707794be302f8470015f10591449c9a031f84396e47e9'
          if h.hexdigest() != expected:
              raise SystemExit(f'SHA-256 DA FONTE R154 INCORRETO: {h.hexdigest()}')
          target = pathlib.Path(os.environ['RUNNER_TEMP'])/'r154_game'
          target.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None: raise SystemExit('CRC invalido na fonte.')
              z.extractall(target)
          project = target/'PIXELRUSH_V327906_LIMPA'
          specpath=project/'buildozer.spec'
          if not specpath.is_file(): raise SystemExit('buildozer.spec ausente.')
          spec=specpath.read_text(encoding='utf-8')
          expected_keys={'package.name':'bigheadmobile_pixelrush','package.domain':'com',
              'version':'3.279.06','android.numeric_version':'327906',
              'android.archs':'arm64-v8a','android.api':'36','android.minapi':'26'}
          for key,val in expected_keys.items():
              m=re.search(r'^\s*'+re.escape(key)+r'\s*=\s*(\S+)\s*$',spec,re.M)
              if not m or m.group(1)!=val: raise SystemExit(f'CONFIG INCOMPATIVEL: {key}')
          if 'python3==3.12.12,hostpython3==3.12.12,pygame-ce' not in spec:
              raise SystemExit('Python 3.12 / pygame-ce da R154 nao encontrado.')
          pcm=list((project/'assets/audio/prebaked_r154').glob('*.pcm'))
          if len(pcm)!=6: raise SystemExit(f'Esperados 6 PCM, encontrados {len(pcm)}.')
          for path in ['main.py','p4a-recipes/pygame-ce/__init__.py','p4a-recipes/python3/__init__.py']:
              if not (project/path).is_file(): raise SystemExit(f'Ausente: {path}')
          with (root/'r154-project-dir.txt').open('w') as f: f.write(str(project))
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a') as f:
              f.write('R154_PROJECT_DIR='+str(project)+'\n')
          print('Fonte R154 exata validada:',expected)
          print('Package ID: com.bigheadmobile_pixelrush; versionCode: 327906; PCM:',len(pcm))
          PY

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Free disk and install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git zip unzip curl wget ca-certificates openjdk-17-jdk \
            build-essential autoconf automake autopoint gettext libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev cmake ninja-build \
            libffi-dev libssl-dev libltdl-dev liblzma-dev libsqlite3-dev \
            ccache binutils python3-pip python3-venv
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          df -h /

      - name: Install isolated Buildozer and patchelf
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/r154-build-venv"
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install -U pip wheel 'setuptools<81' 'Cython==0.29.36' legacy-cgi buildozer 'patchelf>=0.18.0.0'
          echo "$VENV/bin" >> "$GITHUB_PATH"
          if ! "$VENV/bin/patchelf" --help 2>&1 | grep -q -- '--page-size'; then
            echo "ERRO: patchelf sem suporte a --page-size exigido pela receita Python ARM64 da R154."
            exit 2
          fi
          "$VENV/bin/buildozer" --version
          "$VENV/bin/patchelf" --version

      - name: Build APK DEBUG ARM64 (no AAB, no Play signing)
        shell: bash
        run: |
          set -euo pipefail
          cd "$R154_PROJECT_DIR"
          echo "Build R154 em $R154_PROJECT_DIR"
          buildozer -v android debug 2>&1 | tee "$GITHUB_WORKSPACE/R154_BUILD_LOG.txt"
          shopt -s nullglob
          apks=(bin/*.apk)
          if (( ${#apks[@]} == 0 )); then echo 'Buildozer terminou sem APK' >&2; exit 3; fi
          cp "${apks[0]}" "$GITHUB_WORKSPACE/PIXELRUSH_V327906_R154_DEBUG_ARM64.apk"

      - name: Verify package, signature, ABI and 16 KiB ELF alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/PIXELRUSH_V327906_R154_DEBUG_ARM64.apk"
          SDKROOT="$HOME/.buildozer/android/platform/android-sdk"
          AAPT="$(find "$SDKROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$SDKROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$SDKROOT/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$AAPT" && test -x "$APKSIGNER" && test -x "$ZIPALIGN"
          "$AAPT" dump badging "$APK" | grep '^package:' | tee "$GITHUB_WORKSPACE/R154_PACKAGE.txt"
          grep -q "name='com.bigheadmobile_pixelrush'" "$GITHUB_WORKSPACE/R154_PACKAGE.txt"
          grep -q "versionCode='327906'" "$GITHUB_WORKSPACE/R154_PACKAGE.txt"
          "$APKSIGNER" verify --verbose "$APK" | tee "$GITHUB_WORKSPACE/R154_SIGNATURE.txt"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" | tee "$GITHUB_WORKSPACE/R154_ZIPALIGN.txt"
          python3 - <<'PY'
          import os,struct,zipfile
          path=os.environ['GITHUB_WORKSPACE']+'/PIXELRUSH_V327906_R154_DEBUG_ARM64.apk'
          count=0; bad=[]
          with zipfile.ZipFile(path) as z:
              libs=[n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
              if not libs: raise SystemExit('Nenhuma biblioteca nativa encontrada.')
              for n in libs:
                  if not n.startswith('lib/arm64-v8a/'):
                      bad.append('ABI inesperada: '+n);continue
                  b=z.read(n)
                  if b[:5]!=b'\x7fELF\x02' or b[5]!=1 or struct.unpack_from('<H',b,18)[0]!=183:
                      bad.append('ELF ARM64 invalido: '+n);continue
                  po=struct.unpack_from('<Q',b,32)[0]
                  es=struct.unpack_from('<H',b,54)[0]
                  en=struct.unpack_from('<H',b,56)[0]
                  for i in range(en):
                      off=po+i*es
                      if struct.unpack_from('<I',b,off)[0] != 1: continue
                      align=struct.unpack_from('<Q',b,off+48)[0]
                      fileoff=struct.unpack_from('<Q',b,off+8)[0]
                      vaddr=struct.unpack_from('<Q',b,off+16)[0]
                      if align<16384 or (fileoff-vaddr)%16384 !=0:
                          bad.append(f'16KiB ELF NAO APROVADO: {n} align={align}')
                  count+=1
          if bad: raise SystemExit('\n'.join(bad[:30]))
          print(f'ARM64 e ELF 16KiB aprovados: {count} bibliotecas')
          PY
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/R154_APK_SHA256.txt"

      - name: Audit native DT_NEEDED dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,re,subprocess,tempfile,zipfile
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          apk=root/'PIXELRUSH_V327906_R154_DEBUG_ARM64.apk'
          lines=[]
          with zipfile.ZipFile(apk) as archive, tempfile.TemporaryDirectory() as tempdir:
              for name in sorted(n for n in archive.namelist() if n.startswith('lib/arm64-v8a/') and n.endswith('.so')):
                  tmp=pathlib.Path(tempdir)/pathlib.PurePosixPath(name).name
                  tmp.write_bytes(archive.read(name))
                  proc=subprocess.run(['readelf','-dW',str(tmp)],capture_output=True,text=True)
                  if proc.returncode: raise SystemExit('readelf falhou: '+name)
                  needed=re.findall(r'\(NEEDED\).*?\[([^]]+)\]',proc.stdout)
                  lines.append(name+' -> '+(', '.join(needed) if needed else '(sem DT_NEEDED)'))
          (root/'R154_DT_NEEDED.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('DT_NEEDED auditados:',len(lines),'bibliotecas ARM64.')
          print('Obs.: modulos stdlib CPython empaquetados fora de lib/ nao sao cobertos por esta listagem.')
          PY

      - name: Upload verified APK DEBUG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PIXELRUSH_R154_APK_DEBUG_ARM64
          path: PIXELRUSH_V327906_R154_DEBUG_ARM64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Preserve APK if post-build validation fails (NOT HOMOLOGATED)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PIXELRUSH_R154_APK_DEBUG_NAO_HOMOLOGADO
          path: PIXELRUSH_V327906_R154_DEBUG_ARM64.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build diagnostics even on error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PIXELRUSH_R154_BUILD_LOGS
          path: |
            R154_BUILD_LOG.txt
            R154_PACKAGE.txt
            R154_SIGNATURE.txt
            R154_ZIPALIGN.txt
            R154_APK_SHA256.txt
            R154_DT_NEEDED.txt
          if-no-files-found: ignore
          retention-days: 14
