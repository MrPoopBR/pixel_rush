name: PIXEL RUSH QA v3.277.96 R26 - Cidade 2.5D arte organizacao SEM APK

on:
  push:
    branches:
      - qa/r26-both-performance-art-v3.277.96
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixelrush-v327796-r26-offline
  cancel-in-progress: true

jobs:
  qa-r26-offline:
    if: github.repository == 'MrPoopBR/pixel_rush' && github.ref == 'refs/heads/qa/r26-both-performance-art-v3.277.96'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONPATH: .
    steps:
      - name: Checkout com histórico da QA792
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: pygame-ce e análise sintática
        run: |
          set -euo pipefail
          python -m pip install pygame-ce==2.5.8 numpy==2.3.0
          python -m compileall -q src tests
          python -m py_compile PixelRush_v3.277.11_PRODUCAO_ANDROID_RC.py main.py JOGAR.py src/pixelrush/performance/unified_post_v327750.py src/pixelrush/rendering/material_friezes_v327794.py qa_a54/benchmark_present_direct_v327795.py qa_a54/benchmark_city_internal_v327795.py qa_a54/benchmark_city_skip_layers_v327796.py
          python - <<'PY'
          import ast,pathlib
          paths=["PixelRush_v3.277.11_PRODUCAO_ANDROID_RC.py",
                 "src/pixelrush/ui/tutorial/premium_v327793.py",
                 "src/pixelrush/world/daynight_v327793.py",
                 "src/pixelrush/entities/enemies/snowman_v327793.py",
                 "pixelrush_cenarios_v398.py","pixelrush_letras_v3218.py",
                 "pixelrush_inimigos_v3221.py",
                 "pixelrush_biomes2_v3185.py","pixelrush_world_v3185.py",
                 "pixelrush_extras_v3174.py",
                 "src/pixelrush/rendering/material_friezes_v327794.py"]
          for p in paths:
              ast.parse(pathlib.Path(p).read_text("utf8"),filename=p)
          print("QA793 AST 7 arquivos: OK")
          PY
          grep -q '^version = 3.277.96$' buildozer.spec
          grep -q '^android.numeric_version = 327796$' buildozer.spec
          grep -q 'VERSAO = "v3.277.96-QA-ANDROID-RC"' PixelRush_v3.277.11_PRODUCAO_ANDROID_RC.py
      - name: Importar motor real com pygame-ce sem executar main ou escrever saves
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,runpy
          os.environ.setdefault("SDL_VIDEODRIVER","dummy")
          os.environ.setdefault("SDL_AUDIODRIVER","dummy")
          import pygame
          pygame.init()
          pygame.display.set_mode((450,800))
          g=runpy.run_path("PixelRush_v3.277.11_PRODUCAO_ANDROID_RC.py",
                           run_name="pixelrush_qa793_import")
          assert g["VERSAO"]=="v3.277.96-QA-ANDROID-RC"
          assert callable(g["main"])
          assert all(name in g for name in
                     ("AmeacaBioma","BauSecreto","ParallaxBackground",
                      "gerar_padrao","Moeda","PoolManager"))
          print("QA793 import real: motor carregado, entrada main nao executada")
          PY
      - name: Tutorial completo, efeitos, 3 minutos, inimigos reais e RGBA
        run: |
          set -euo pipefail
          python tests/test_qa_r23_gameplay_tutorial_v327793.py
          python tests/test_qa_r23_camera_sky_v327793.py
          python tests/test_qa_r23_pombo_v327793.py
          python tests/test_qa_r23_biome_specials_v327793.py
          python tests/test_qa_r23_migracao_modulos_v327793.py
          python tests/test_qa_r23_zoom_direto_v327793.py
          python tests/test_qa_r23_city_art_v327793.py
          python tests/test_qa_r24_material_friezes_v327794.py
          python tests/test_qa_r25_art_finish_v327795.py
          python tests/test_qa_r26_material_finish_v327796.py
      - name: Executar testes estruturais antigos na base QA792 isolada
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/qa792" d8f97adf246bc593da3bb049bef2f3a5c31dd698
          ( cd "$RUNNER_TEMP/qa792" &&
            PYTHONPATH=. python tests/test_qa_r22_classes_historicos_v327792.py &&
            PYTHONPATH=. python tests/test_qa_r20_motor_modulos_v327790.py &&
            PYTHONPATH=. python tests/test_qa_r19_modulos_migrados_v327789.py )
      - name: Integridade main, DEV, saves, assets, AAB e só versão buildozer
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base="d8f97adf246bc593da3bb049bef2f3a5c31dd698"
          old=lambda p:subprocess.check_output(["git","show",base+":"+p])
          changed=subprocess.check_output(["git","diff","--name-only",base,"HEAD"],text=True).splitlines()
          prefix=("src/pixelrush/","tests/","docs/")
          manifest=__import__("json").loads(Path("docs/arquitetura/MANIFESTO_R23_MIGRACAO_v327793.json").read_text("utf8"))
          assert len(manifest["migrated"])==48
          allowed={e["legacy"] for e in manifest["migrated"]}
          for entry in manifest["migrated"]:
              if entry.get("byte_identical",True):
                  assert old(entry["legacy"]) == Path(entry["canonical"]).read_bytes()
              else:
                  assert entry["legacy"]=="pixelrush_qa_unified_post_v327750.py"
                  assert entry["approved_change"]=="qa795_direct_present_rgba_gate"
                  sha=subprocess.check_output(["git","hash-object",entry["canonical"]],text=True).strip()
                  assert sha==entry["git_blob_sha"], (sha,entry["git_blob_sha"])
          allowed.update({"PixelRush_v3.277.11_PRODUCAO_ANDROID_RC.py",
                   "pixelrush_cenarios_v398.py","pixelrush_inimigos_v3221.py",
                   "pixelrush_letras_v3218.py","buildozer.spec","VERSAO_ATUAL.txt",
                   "README.md",".github/workflows/qa-r23-gameplay-v327793.yml",
                   "qa_a54/benchmark_city_preclear_v327793.py",
                   "pixelrush_world_v3130.py",
                   "pixelrush_gamefeel_v3152.py",
                   "qa_a54/benchmark_modular_preclear_v327793.py",
                   "qa_a54/benchmark_world_marathon_v327793.py",
                   "qa_a54/benchmark_fabrik_batch_v327793.py",
                   "qa_a54/benchmark_postsprites_v327793.py",
                   "pixelrush_profissional_v3108.py",
                   "pixelrush_city2_v3124.py",
                   "pixelrush_biomes2_v3185.py",
                   "pixelrush_world_v3185.py",
                   "pixelrush_extras_v3174.py",
                   "qa_a54/benchmark_replay_pool_v327794.py",
                   ".github/workflows/qa-r24-duas-frentes-v327794.yml",
                   "qa_a54/benchmark_hidden_train_v327793.py",
                   "qa_a54/benchmark_present_direct_v327795.py",
                   "qa_a54/benchmark_city_internal_v327795.py",
                   ".github/workflows/qa-r25-perf-art-v327795.yml",
                   "qa_a54/benchmark_city_skip_layers_v327796.py",
                   ".github/workflows/qa-r26-two-frentes-v327796.yml"})
          illegal=[p for p in changed if p not in allowed and not p.startswith(prefix)]
          assert not illegal,illegal
          forbidden=("main.py","JOGAR.py","requirements.txt",".gitignore")
          for p in forbidden:
              assert old(p)==Path(p).read_bytes(),p
          assert not any(p.startswith(("assets/","p4a-recipes/")) for p in changed)
          assert not any(p.startswith(".github/workflows/") and
                         p not in (".github/workflows/qa-r23-gameplay-v327793.yml",
                                  ".github/workflows/qa-r24-duas-frentes-v327794.yml",
                                  ".github/workflows/qa-r25-perf-art-v327795.yml",
                                   ".github/workflows/qa-r26-two-frentes-v327796.yml") for p in changed)
          before=old("buildozer.spec")
          expect=before.replace(b"version = 3.277.92",b"version = 3.277.96").replace(
              b"android.numeric_version = 327792",b"android.numeric_version = 327796")
          assert Path("buildozer.spec").read_bytes()==expect
          assert Path("docs/versoes/NOTAS_v3.277.96_QA.md").is_file()
          assert Path("VERSAO_ATUAL.txt").read_text().startswith("PIXEL RUSH v3.277.96")
          print("Protegidos main, DEV, assets, receitas, AAB, saves: nenhum arquivo alterado")
          PY
      - name: Benchmark de regressão do render 2.5D com qualidade completa
        run: |
          set -euo pipefail
          python qa_a54/benchmark_city_technical_v327787.py \
            --limit 20 --light 0 --opaque 1 --tech 1 --output "$RUNNER_TEMP/qa793_city.json"
          python - <<'PY'
          import json,os,pathlib
          result=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"qa793_city.json").read_text("utf8"))
          assert result["quadros_rgba"] == 260
          assert result["periodo_redesenho_preservado"] == 5
          assert result["hashes_rgba"]
          print("QA793 Cidade 2.5D RGBA:",result["quadros_rgba"],"buffers, período 5")
          PY
      - name: Perfil A/B Cidade 2.5D por passe e RGBA (sem integrar candidato)
        run: |
          set -euo pipefail
          python qa_a54/benchmark_city_preclear_v327793.py --candidato 0 --output qa_a54/qa793_preclear_baseline.json
          python qa_a54/benchmark_city_preclear_v327793.py --candidato 1 --output qa_a54/qa793_preclear_candidate.json
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path("qa_a54/qa793_preclear_baseline.json").read_text())
          c=json.loads(Path("qa_a54/qa793_preclear_candidate.json").read_text())
          assert b["hashes_rgba"]==c["hashes_rgba"]
          assert b["rgba_count"]==c["rgba_count"]==260
          assert b["quality"]==c["quality"]=="completo"
          for name in b["per_pass"]:
              a=b["per_pass"][name]["p50_ms"];v=c["per_pass"][name]["p50_ms"]
              print("QA793",name,"p50 ms baseline",a,"candidate",v,
                    "change %",round(100*(v/a-1),2) if a else "n/a")
          print("QA793 260 RGBA EXATOS; proposta ainda não integrada")
          PY
      - name: Experimento 2 normal e flow direto no target sem superfície intermediária
        run: |
          set -euo pipefail
          python qa_a54/benchmark_city_preclear_v327793.py --candidato 1 --direto 0 --output qa_a54/qa793_direct_baseline.json
          python qa_a54/benchmark_city_preclear_v327793.py --candidato 1 --direto 1 --output qa_a54/qa793_direct_candidate.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("qa_a54/qa793_direct_baseline.json").read_text())
          b=json.loads(Path("qa_a54/qa793_direct_candidate.json").read_text())
          same=a["hashes_rgba"]==b["hashes_rgba"]
          assert same, "QA793 FLOW direto alterou RGBA: integração bloqueada"
          assert a["flow_buffer_residente"] and not b["flow_buffer_residente"], "buffer FLOW nao eliminado"
          print("QA793 LAB2 RGBA:",sum(x!=y for x,y in zip(a["hashes_rgba"],b["hashes_rgba"])),
                "divergencias de 260; candidato", "APTO" if same else "REPROVADO")
          for name in ("normal","flow"):
              before=a["per_pass"][name]["p50_ms"]
              after=b["per_pass"][name]["p50_ms"]
              print(name,"p50 controle",before,"candidato",after,"percentual",round(100*(after/before-1),2))
          # Candidato não integrado: discrepância é diagnóstico, não aprovação.
          PY
      - name: LAB R23 Neve/Deserto 2.5D RGBA + RAM vs limpeza de buffers
        run: |
          set -euo pipefail
          python qa_a54/benchmark_modular_preclear_v327793.py --candidato 0 --output qa_a54/qa793_modular_baseline.json
          python qa_a54/benchmark_modular_preclear_v327793.py --candidato 1 --output qa_a54/qa793_modular_candidate.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("qa_a54/qa793_modular_baseline.json").read_text("utf8"))
          b=json.loads(Path("qa_a54/qa793_modular_candidate.json").read_text("utf8"))
          same=a["rgba_hashes"]==b["rgba_hashes"]
          assert same, "Normal modular alterou RGBA; otimização integrada bloqueada"
          print("QA793 modular Neve/Deserto RGBA:",len(a["rgba_hashes"]),
                "frames", "idênticos" if same else "DIVERGENTES")
          for name in a["per_pass"]:
              x=a["per_pass"][name]["p50_ms"];y=b["per_pass"][name]["p50_ms"]
              print(name,"p50 controle",x,"candidato",y,"delta %",
                    round(100*(y/x-1),2) if x else "n/a")
          print("Pico RAM KiB controle/candidato",a["rss_peak_kib"],b["rss_peak_kib"])
          # Otimizacao do mapa NORMAL ja integrada; igualdade e gate BLOQUEANTE.
          Path("qa_a54/qa793_modular_diagnostico.json").write_text(
              json.dumps({"rgba_iguais":same,"quantidade":len(a["rgba_hashes"])},
                         indent=2),encoding="utf8")
          PY
      - name: LAB R23 trem opaco NORMAL/FLOW com hashes RGBA
        run: |
          set -euo pipefail
          python qa_a54/benchmark_hidden_train_v327793.py --limit 20 --light 0 --opaque 1 --tech 1 --skip-train 0 --output qa_a54/qa793_train_base.json
          python qa_a54/benchmark_hidden_train_v327793.py --limit 20 --light 0 --opaque 1 --tech 1 --skip-train 1 --output qa_a54/qa793_train_candidate.json
          python qa_a54/benchmark_hidden_train_v327793.py --limit 20 --light 0 --opaque 0 --tech 1 --skip-train 1 --output qa_a54/qa793_train_no_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('qa_a54')
          a=json.loads((root/'qa793_train_base.json').read_text())
          b=json.loads((root/'qa793_train_candidate.json').read_text())
          c=json.loads((root/'qa793_train_no_audit.json').read_text())
          assert a['hashes_rgba']==b['hashes_rgba'] and a['quadros_rgba']==b['quadros_rgba']==260
          assert a['train_calls'].get('normal',0)>0 and a['train_calls'].get('flow',0)>0
          assert b['train_calls'].get('normal',0)==b['train_calls'].get('flow',0)==0
          assert c['train_calls'].get('normal',0)>0 and c['train_calls'].get('flow',0)>0
          for name in ('normal','flow','fifth_total'):
              x=a['timings'][name]['p50_ms'];y=b['timings'][name]['p50_ms']
              print('QA793 train',name,'p50 old/new',x,y,'delta %',round(100*(y/x-1),2) if x else 'N/A')
          print('QA793 260 hashes RGBA iguais e fallback sem QA786 confirmado')
          PY
      - name: LAB R23 modular todos mapas preclear x normal integrado, 160 RGBA
        run: |
          set -euo pipefail
          python qa_a54/benchmark_modular_preclear_v327793.py --candidato 1 --output qa_a54/qa793_modular_all_before.json
          python qa_a54/benchmark_modular_preclear_v327793.py --candidato 2 --output qa_a54/qa793_modular_all_after.json
          python qa_a54/benchmark_modular_preclear_v327793.py --candidato 3 --output qa_a54/qa794_modular_integrated.json
          PIXELRUSH_QA_MODULAR_ALL_PRECLEAR=0 python qa_a54/benchmark_modular_preclear_v327793.py --candidato 3 --output qa_a54/qa794_modular_rollback.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("qa_a54/qa793_modular_all_before.json").read_text())
          b=json.loads(Path("qa_a54/qa793_modular_all_after.json").read_text())
          assert len(a["rgba_hashes"])==len(b["rgba_hashes"])==160
          assert a["rgba_hashes"]==b["rgba_hashes"], "RGBA divergente: candidato modular rejeitado"
          c=json.loads(Path("qa_a54/qa794_modular_integrated.json").read_text())
          d=json.loads(Path("qa_a54/qa794_modular_rollback.json").read_text())
          assert b["rgba_hashes"]==c["rgba_hashes"], "codigo integrado divergiu"
          assert a["rgba_hashes"]==d["rgba_hashes"], "fallback divergiu"
          assert a["quality"]==b["quality"]==c["quality"]==d["quality"]=="completo"
          for name in a["per_pass"]:
              aa=a["per_pass"][name]["p50_ms"]
              bb=b["per_pass"][name]["p50_ms"]
              print("QA793 MOD ALL",name,"p50 antes",aa,"depois",bb,"delta %",
                    round(100*(bb/aa-1),2) if aa else "N/A")
          print("QA794 modular todos os passes: 160 RGBA exatos, integrado no motor")
          PY
      - name: Maratona R23 de 140 quadros em 7 biomas, sem reduzir graficos
        run: |
          set -euo pipefail
          python qa_a54/benchmark_world_marathon_v327793.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("qa_a54/qa793_seven_biomes.json").read_text("utf8"))
          assert d["frames_total"]==140 and d["rgba_total"]==280
          assert d["quality"]=="completo" and len(d["biomes"])==7
          print("R23 7 biomas: 140 quadros, 280 RGBA, memória e tempos por passe")
          PY
      - name: Laboratorio A/B deformacao FABRIK de props, 180 RGBA
        run: |
          set -euo pipefail
          python qa_a54/benchmark_fabrik_batch_v327793.py --candidato 0 --output qa_a54/qa793_fabrik_baseline.json
          python qa_a54/benchmark_fabrik_batch_v327793.py --candidato 1 --output qa_a54/qa793_fabrik_candidate.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("qa_a54/qa793_fabrik_baseline.json").read_text("utf8"))
          b=json.loads(Path("qa_a54/qa793_fabrik_candidate.json").read_text("utf8"))
          same=a["hashes_rgba"]==b["hashes_rgba"]
          assert same, "FABRIK batch alterou pixels RGBA: otimização bloqueada"
          print("QA793 FABRIK RGBA",sum(len(v) for v in a["hashes_rgba"].values()),
                "idênticos" if same else "DIVERGENTES")
          for biome in a["biomes"]:
              x=a["timings"][biome]["p50_ms"]
              y=b["timings"][biome]["p50_ms"]
              print(biome,"p50 baseline",x,"candidate",y,
                    "delta %",round(100*(y/x-1),2) if x else "n/a")
          Path("qa_a54/qa793_fabrik_diagnostico.json").write_text(
              json.dumps({"rgba_iguais":same,"apto_para_integrar":same and all(
                  b["timings"][biome]["p50_ms"]<a["timings"][biome]["p50_ms"]
                  for biome in a["biomes"])},indent=2),encoding="utf8")
          PY
      - name: Perfil real dos efeitos pós-sprites sem tocar física nem assets
        run: |
          set -euo pipefail
          python qa_a54/benchmark_postsprites_v327793.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("qa_a54/qa793_postsprites.json").read_text("utf8"))
          assert r["quadros_por_passagem"]==240
          assert r["amostras_rgba_comparadas"]==8
          assert len(r["tempos_primeira"])==len(r["tempos_repeticao"])==12
          assert all(v["n"]>=4 for v in r["tempos_primeira"].values())
          print("QA793 pós-sprites determinístico:",
                {k:v.get("p95_ms") for k,v in r["tempos_repeticao"].items()})
          PY
      - name: R24 replay pos-sprites A/B 180 capturas 288 RGBA e alocacoes
        run: |
          set -euo pipefail
          python qa_a54/benchmark_replay_pool_v327794.py --candidate 0 --output qa_a54/qa794_replay_before.json
          python qa_a54/benchmark_replay_pool_v327794.py --candidate 1 --output qa_a54/qa794_replay_after.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("qa_a54/qa794_replay_before.json").read_text())
          b=json.loads(Path("qa_a54/qa794_replay_after.json").read_text())
          assert a["rgba_hashes"]==b["rgba_hashes"], "Replay visual mudou RGBA"
          assert all(len(v)==72 for v in a["rgba_hashes"].values())
          assert a["reuses"]==0 and b["reuses"]==108
          assert a["cached"]==b["cached"]==72
          assert b["p50_ms"]<a["p50_ms"], "Replay reciclado nao teve ganho isolado"
          print("QA794 Replay",sum(len(v) for v in a["rgba_hashes"].values()),
                "RGBA exatos; 108 alocacoes evitadas; p50 old/new",
                a["p50_ms"],b["p50_ms"])
          PY
      - name: R25 SDL apresentação direta RGBA 60 casos com fallback e benchmark
        run: |
          set -euo pipefail
          python qa_a54/benchmark_present_direct_v327795.py --candidate 0 --output qa_a54/qa795_present_baseline.json
          python qa_a54/benchmark_present_direct_v327795.py --candidate 1 --output qa_a54/qa795_present_direct.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("qa_a54/qa795_present_baseline.json").read_text())
          b=json.loads(Path("qa_a54/qa795_present_direct.json").read_text())
          assert a["sample_count"]==b["sample_count"]==60
          assert a["rgba_hashes"]==b["rgba_hashes"], "RGBA divergente em escala direta"
          assert all(n==0 for n in a["direct_counts"].values())
          for name in ("rgb_900","rgb_1080_letterbox","rgb_360"):
              assert b["direct_counts"][name]==36,(name,b["direct_counts"])
          for name in ("rgba_fallback","colorkey_fallback","no_scale"):
              assert b["direct_counts"][name]==0,(name,b["direct_counts"])
          for name in ("rgb_900","rgb_1080_letterbox"):
              x=a["p50_ms"][name];y=b["p50_ms"][name]
              print("QA795 apresentacao",name,"p50 antes",x,"depois",y,
                    "delta %",round(100*(y/x-1),2))
              assert y < x*0.95,(name,"sem ganho confirmado")
          print("QA795 present: 60 hashes RGBA por processo, SDL direto validado")
          PY
      - name: R25 Cidade 2.5D perfil interno do quinto quadro 240 RGBA
        run: |
          set -euo pipefail
          python qa_a54/benchmark_city_internal_v327795.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("qa_a54/qa795_city_internal.json").read_text())
          assert d["frames"]==120 and d["fifth_period"]==5
