name: Pixel Rush RC - APK Android DEBUG (sem assinatura Play)

on:
  push:
    branches:
      - integracao/android-rc-v3.277.11-revisao
    paths:
      - '.github/workflows/build-apk-debug-rc.yml'
      - '.github/scripts/android_debug_audit.py'
      - 'buildozer.spec'
      - 'p4a-recipes/**'
      - 'main.py'
      - 'PixelRush_v3.277.11_PRODUCAO_ANDROID_RC.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixelrush-rc-apk-debug
  cancel-in-progress: false

jobs:
  apk-debug:
    if: github.repository == 'MrPoopBR/pixel_rush' && github.ref == 'refs/heads/integracao/android-rc-v3.277.11-revisao'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: '0'
      MAKEFLAGS: '-j4'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout RC (somente ramo de revisao)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Inspecionar configuracao e integridade antes do build
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/android_debug_audit.py preflight --report preflight-debug.json
          python3 -m compileall -q main.py pixelrush_android_storage_v327711.py PixelRush_v3.277.11_PRODUCAO_ANDROID_RC.py p4a-recipes/pygame-ce/__init__.py
          if [ -n "$(find . -maxdepth 1 -name '*.aab' -print -quit)" ]; then
            echo 'Arquivo AAB inesperado na raiz.' >&2
            exit 1
          fi

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Python 3.14 para ferramenta Buildozer
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Liberar espaco para compilacao nativa
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Instalar dependencias Linux de compilacao
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip curl wget ca-certificates build-essential binutils \
            autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev gettext autopoint ccache

      - name: Configurar Buildozer 1.6.0 e dependencias de p4a/develop
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install 'buildozer==1.6.0' 'Cython==0.29.34' legacy-cgi
          buildozer --version
          python --version
          java -version

      - name: Compilar SOMENTE APK debug (sem secrets, sem release e sem AAB)
        shell: bash
        run: |
          set -euo pipefail
          unset P4A_RELEASE_KEYSTORE P4A_RELEASE_KEYALIAS \
            P4A_RELEASE_KEYSTORE_PASSWD P4A_RELEASE_KEYALIAS_PASSWD || true
          echo 'Iniciando build DEBUG. Nunca executa android release.'
          buildozer -v android debug 2>&1 | tee build-debug.log
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if find bin -maxdepth 1 -type f -name '*.aab' | grep -q .; then
            echo 'AAB encontrado indevidamente em bin/' >&2
            exit 1
          fi

      - name: Auditar ABI, extensoes pygame/NumPy, API 36 e paginas 16 KiB
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          python .github/scripts/android_debug_audit.py apk --apk "$APK" --report debug-apk-validation.json

      - name: Enviar relatorios e log de diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixelrush-rc-debug-diagnostico
          path: |
            preflight-debug.json
            debug-apk-validation.json
            build-debug.log
          if-no-files-found: warn
          retention-days: 7

      - name: Enviar APK debug para teste (nunca AAB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixelrush-rc-apk-debug-nao-homologado
          path: bin/*.apk
          if-no-files-found: ignore
          retention-days: 7
