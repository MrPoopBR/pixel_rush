name: "PIXEL RUSH R156 QA - Profiler interno e APK DEBUG ARM64"

on:
  push:
    branches:
      - qa/r156-profiler-327908
    paths:
      - ".github/workflows/r156-qa-profiler-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixelrush-r156-profiler-qa
  cancel-in-progress: false

jobs:
  validar-fonte-e-instrumentacao:
    if: github.repository == 'MrPoopBR/pixel_rush' && github.ref == 'refs/heads/qa/r156-profiler-327908'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout da branch QA (sem alterar a R155)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reconstruir fonte oficial R154 e verificar SHA-256 completo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          parts = [root / "r154-source" / ("r154-source.part%02d" % i) for i in range(1,5)]
          sizes = [10000000,10000000,10000000,8155030]
          if not all(x.is_file() for x in parts):
              raise SystemExit("FALTAM AS PARTES OFICIAIS DA R154")
          if [x.stat().st_size for x in parts] != sizes:
              raise SystemExit("Tamanho de partes da R154 divergiu")
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          archive = tmp / "R154_FONTE_OFICIAL.zip"
          digest = hashlib.sha256()
          with archive.open("wb") as out:
              for p in parts:
                  with p.open("rb") as inp:
                      for block in iter(lambda: inp.read(1024*1024),b""):
                          digest.update(block); out.write(block)
          expected = "2a27e23a55142b8ce1f707794be302f8470015f10591449c9a031f84396e47e9"
          if digest.hexdigest() != expected:
              raise SystemExit("SHA-256 DA FONTE DIVERGIU: " + digest.hexdigest())
          source = tmp / "r156_src"
          source.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None:
                  raise SystemExit("CRC da fonte R154 invalido")
              for item in z.infolist():
                  name = pathlib.PurePosixPath(item.filename)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit("Caminho suspeito na fonte R154")
              z.extractall(source)
          project = source / "PIXELRUSH_V327906_LIMPA"
          if not (project / "buildozer.spec").is_file():
              raise SystemExit("FONTE OFICIAL R154 nao encontrada na estrutura esperada")
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a") as f:
              f.write("QA_PROJECT_DIR=" + str(project) + "\n")
          print("Fonte R154 exata validada SHA-256", expected)
          PY

      - name: Aplicar correcoes oficiais R155 com validacao criptografica
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/r155_apply_bytecode_fix.py "$QA_PROJECT_DIR"
          python3 - <<'PY'
          import pathlib, os, re
          p=pathlib.Path(os.environ["QA_PROJECT_DIR"])
          spec=(p/"buildozer.spec").read_text()
          assert re.search(r"^version = 3\.279\.07$", spec, re.M)
          assert re.search(r"^android.numeric_version = 327907$", spec, re.M)
          assert re.search(r"^package.name = bigheadmobile_pixelrush$", spec, re.M)
          assert "class _LegacyBytecodeLoader" in (p/"src/pixelrush/platform/legacy_imports_v327797.py").read_text()
          print("R155 oficial reconstruida e loader .pyc verificado")
          PY
          cp -a "$QA_PROJECT_DIR" "$RUNNER_TEMP/r155_before_profiler"

      - name: Instalar e executar testes pygame-ce da instrumentacao
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/r156_pytest"
          "$RUNNER_TEMP/r156_pytest/bin/python" -m pip install --disable-pip-version-check pygame-ce==2.5.8
          "$RUNNER_TEMP/r156_pytest/bin/python" -m unittest discover -s qa_r156 -p 'test_*.py' -v

      - name: Integrar R156 no codigo real e validar TODA a sintaxe Python
        shell: bash
        run: |
          set -euo pipefail
          python3 qa_r156/aplicar_r156_qa.py "$QA_PROJECT_DIR" | tee "$GITHUB_WORKSPACE/R156_PONTOS_INSTRUMENTADOS.txt"
          python3 - <<'PY'
          import ast, os, pathlib, re, hashlib, json
          current=pathlib.Path(os.environ["QA_PROJECT_DIR"])
          original=pathlib.Path(os.environ["RUNNER_TEMP"])/"r155_before_profiler"
          checked=0; transformed=0
          injected_import="import pixelrush_qa_internal as _pixelrush_qa_internal"
          for base_file in original.rglob("*"):
              if not base_file.is_file(): continue
              relative=base_file.relative_to(original)
              changed=current/relative
              if not changed.is_file(): raise SystemExit("ARQUIVO ORIGINAL DESAPARECEU: "+str(relative))
              if base_file.suffix==".py":
                  before=base_file.read_text(encoding="utf-8")
                  after=changed.read_text(encoding="utf-8")
                  lines=[]
                  for line in after.splitlines(keepends=True):
                      v=line.strip()
                      if v==injected_import or v=="_pixelrush_qa_internal.frame_tick()" or v.startswith("@_pixelrush_qa_internal.measure("):
                          continue
                      lines.append(line)
                  clean="".join(lines).replace('VERSAO = "v3.279.08-QA-PROFILER"', 'VERSAO = "v3.279.07-ANDROID-RC"')
                  if clean!=before:
                      raise SystemExit("REGRESSAO NO CODIGO ORIGINAL: "+str(relative))
                  ast.parse(after, filename=str(changed))
                  compile(after, str(changed), "exec")
                  checked+=1
                  transformed+=int(after!=before)
              elif relative.as_posix() not in ("buildozer.spec","VERSAO_ATUAL.txt"):
                  if hashlib.sha256(base_file.read_bytes()).digest()!=hashlib.sha256(changed.read_bytes()).digest():
                      raise SystemExit("ASSET OU OUTRO ARQUIVO ORIGINAL MODIFICADO: "+str(relative))
          for py in current.rglob("*.py"):
              compile(py.read_bytes(), str(py), "exec")
          spec=(current/"buildozer.spec").read_text()
          for line in ("package.name = bigheadmobile_pixelrush_qa", "version = 3.279.08",
                       "android.numeric_version = 327908"):
              if line not in spec: raise SystemExit("QA CONFIG INVALIDA: "+line)
          if not (current/"pixelrush_qa_internal.py").exists():raise SystemExit("MOTOR DE PROFILING AUSENTE")
          if not (current/"RELATORIO_INSTRUMENTACAO_R156.txt").is_file():raise SystemExit("RELATORIO AUSENTE")
          report={"resultado":"FONTE_INTEGRADA_ESTATICAMENTE","codigo_py_verificado":checked,
                  "arquivos_py_instrumentados":transformed,
                  "nao_py_originais_inalterados":True,
                  "reversibilidade_textual":True,
                  "homologado_android":False}
          pathlib.Path(os.environ["GITHUB_WORKSPACE"],"R156_VERIFICACAO_FONTE.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY

      - name: Empacotar ZIP completo R156 QA (separado da R155)
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/PIXELRUSH_V327908_R156_QA_PROFILER"
          mv "$QA_PROJECT_DIR" "$DEST"
          cd "$RUNNER_TEMP"
          zip -q -r "$GITHUB_WORKSPACE/PIXELRUSH_V327908_R156_QA_PROFILER_COMPLETO.zip" PIXELRUSH_V327908_R156_QA_PROFILER -x '*/__pycache__/*' '*.pyc'
          sha256sum "$GITHUB_WORKSPACE/PIXELRUSH_V327908_R156_QA_PROFILER_COMPLETO.zip" | tee "$GITHUB_WORKSPACE/R156_FONTE_SHA256.txt"

      - name: Publicar ZIP COMPLETO da fonte QA
        uses: actions/upload-artifact@v4
        with:
          name: PIXELRUSH_R156_FONTE_QA_COMPLETA
          path: PIXELRUSH_V327908_R156_QA_PROFILER_COMPLETO.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publicar validacoes R156
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PIXELRUSH_R156_VALIDACAO_FONTE
          path: |
            R156_PONTOS_INSTRUMENTADOS.txt
            R156_VERIFICACAO_FONTE.json
            R156_FONTE_SHA256.txt
          if-no-files-found: ignore
          retention-days: 30

  compilar-apk-qa:
    needs: validar-fonte-e-instrumentacao
    if: github.repository == 'MrPoopBR/pixel_rush' && github.ref == 'refs/heads/qa/r156-profiler-327908'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
      MAKEFLAGS: "-j4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout somente dos scripts QA
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Obter a FONTE QA previamente validada
        uses: actions/download-artifact@v4
        with:
          name: PIXELRUSH_R156_FONTE_QA_COMPLETA
          path: .

      - name: Extrair fonte R156 QA validada
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, zipfile
          artifact=pathlib.Path("PIXELRUSH_V327908_R156_QA_PROFILER_COMPLETO.zip")
          if not artifact.is_file():raise SystemExit("Artefato QA ausente")
          dest=pathlib.Path(os.environ["RUNNER_TEMP"])/"r156_build"
          dest.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(artifact) as z:
              if z.testzip() is not None:raise SystemExit("CRC do ZIP QA invalido")
              z.extractall(dest)
          project=dest/"PIXELRUSH_V327908_R156_QA_PROFILER"
          spec=(project/"buildozer.spec").read_text()
          for expected in ("package.name = bigheadmobile_pixelrush_qa", "version = 3.279.08", "android.numeric_version = 327908"):
              if expected not in spec:raise SystemExit("Fonte QA divergente: "+expected)
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a") as f:f.write("R156_BUILD_DIR="+str(project)+"\n")
          print("Build R156 QA isolada",project)
          PY

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias e liberar espaco
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git zip unzip curl wget ca-certificates openjdk-17-jdk \
            build-essential autoconf automake autopoint gettext libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev cmake ninja-build \
            libffi-dev libssl-dev libltdl-dev liblzma-dev libsqlite3-dev \
            ccache binutils python3-pip python3-venv
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          df -h /

      - name: Instalar Buildozer isolado com patchelf alinhado a 16 KiB
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/r156-build-venv"
          python3 -m venv --system-site-packages "$VENV"
          "$VENV/bin/python" -m pip install -U pip wheel 'setuptools<81' 'Cython==0.29.36' legacy-cgi buildozer 'patchelf>=0.18.0.0'
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/patchelf" --help | grep -q -- '--page-size'
          "$VENV/bin/buildozer" --version

      - name: Compilar APK DEBUG ARM64 QA (sem AAB e sem chave de producao)
        shell: bash
        run: |
          set -euo pipefail
          cd "$R156_BUILD_DIR"
          buildozer -v android debug 2>&1 | tee "$GITHUB_WORKSPACE/R156_BUILD_LOG.txt"
          python3 - <<'PY'
          import glob,os,shutil
          apks=glob.glob("bin/*.apk")
          if not apks:raise SystemExit("Buildozer nao produziu APK")
          shutil.copyfile(apks[0],os.environ["GITHUB_WORKSPACE"]+"/PIXELRUSH_R156_QA_PROFILER_DEBUG_ARM64.apk")
          PY

      - name: Verificar assinatura debug, package, versionCode e alinhamento ARM64
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/PIXELRUSH_R156_QA_PROFILER_DEBUG_ARM64.apk"
          SDKROOT="$HOME/.buildozer/android/platform/android-sdk"
          AAPT="$(find "$SDKROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          SIGNER="$(find "$SDKROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$SDKROOT/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$AAPT" && test -x "$SIGNER" && test -x "$ZIPALIGN"
          "$AAPT" dump badging "$APK" | grep '^package:' | tee "$GITHUB_WORKSPACE/R156_PACKAGE.txt"
          grep -q "name='com.bigheadmobile_pixelrush_qa'" "$GITHUB_WORKSPACE/R156_PACKAGE.txt"
          grep -q "versionCode='327908'" "$GITHUB_WORKSPACE/R156_PACKAGE.txt"
          "$SIGNER" verify --verbose "$APK" | tee "$GITHUB_WORKSPACE/R156_SIGNATURE.txt"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" | tee "$GITHUB_WORKSPACE/R156_ZIPALIGN.txt"
          python3 - <<'PY'
          import io, os, tarfile, zipfile, json, hashlib
          p=os.environ["GITHUB_WORKSPACE"]+"/PIXELRUSH_R156_QA_PROFILER_DEBUG_ARM64.apk"
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, "CRC APK invalido"
              with tarfile.open(fileobj=io.BytesIO(z.read("assets/private.tar")),mode="r:*") as t:
                  names=t.getnames()
                  assert any("pixelrush_qa_internal.py" in n for n in names), "Profiler nao empacotado no APK"
                  assert any(n.endswith("main.py") or n.endswith("main.pyc") for n in names), "Entrypoint ausente"
              libs=[n for n in z.namelist() if n.startswith("lib/") and n.endswith(".so")]
              assert libs and all(n.startswith("lib/arm64-v8a/") for n in libs), "ABI incorreta"
          report={"resultado":"VALIDACAO_ESTATICA_APK_QA","package":"com.bigheadmobile_pixelrush_qa",
                  "versionCode":327908,"apk_sha256":hashlib.sha256(open(p,"rb").read()).hexdigest(),
                  "homologado_android":False}
          with open("R156_AUDITORIA_APK.json","w") as out:json.dump(report,out,indent=2)
          print(json.dumps(report,indent=2))
          PY
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/R156_APK_SHA256.txt"

      - name: Publicar APK DEBUG QA validado estaticamente
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PIXELRUSH_R156_APK_QA_PROFILER_DEBUG_ARM64
          path: PIXELRUSH_R156_QA_PROFILER_DEBUG_ARM64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Preservar APK se validacao final falhar (NAO HOMOLOGADO)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PIXELRUSH_R156_APK_QA_NAO_VALIDADO
          path: PIXELRUSH_R156_QA_PROFILER_DEBUG_ARM64.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Preservar logs mesmo em falhas de compilacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PIXELRUSH_R156_QA_BUILD_LOGS
          path: |
            R156_BUILD_LOG.txt
            R156_PACKAGE.txt
            R156_SIGNATURE.txt
            R156_ZIPALIGN.txt
            R156_AUDITORIA_APK.json
            R156_APK_SHA256.txt
          if-no-files-found: ignore
          retention-days: 30
